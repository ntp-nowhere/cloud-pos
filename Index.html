<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>58mm Decoupled POS</title>
  <style>
    body { font-family: -apple-system, system-ui, BlinkMacSystemFont, sans-serif; background: #f4f6f8; margin: 0; padding: 20px; }
    .pos-layout { max-width: 500px; margin: 0 auto; background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.06); }
    h2 { text-align: center; margin-top: 0; }
    .badge { width: 100%; box-sizing: border-box; text-align: center; padding: 8px; border-radius: 6px; font-weight: bold; margin-bottom: 15px; }
    .status-disconnected { background: #fce8e6; color: #c5221f; }
    .status-connected { background: #e6f4ea; color: #137333; }
    .btn { display: block; width: 100%; box-sizing: border-box; padding: 14px; font-size: 1rem; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; margin-bottom: 10px; }
    .btn-connect { background: #1a73e8; color: white; }
    .btn-checkout { background: #1e8e3e; color: white; }
    .btn:disabled { background: #dadce0; color: #70757a; cursor: not-allowed; }
    .cart-summary { background: #f8f9fa; border-radius: 6px; padding: 12px; margin: 15px 0; border: 1px dashed #ced4da; }
    .flex-row { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 0.95rem; }
  </style>
</head>
<body>

<div class="pos-layout">
  <h2>⚡ Independent POS Register</h2>
  <div id="printerStatus" class="badge status-disconnected">❌ Bluetooth Printer Offline</div>
  
  <button id="connectBtn" class="btn btn-connect">🔗 Pair 58mm Thermal Printer</button>

  <div class="cart-summary">
    <h3>Cart Review</h3>
    <div class="flex-row"><span>1x Hot Espresso</span><span>$3.00</span></div>
    <div class="flex-row"><span>2x Sugar Croissant</span><span>$9.00</span></div>
    <hr style="border: 0; border-top: 1px solid #dee2e6;">
    <div class="flex-row" style="font-weight:bold; font-size:1.1rem;"><span>Total Amount</span><span>$12.00</span></div>
  </div>

  <button id="checkoutBtn" class="btn btn-checkout" disabled>💳 Submit & Print Receipt</button>
</div>

<script>
  // Paste your copied deployed Apps Script URL link value here:
  const GOOGLE_SCRIPT_API_URL = "https://script.google.com/macros/s/AKfycbziijSM4sG4lEQunxv4icHdJARYGiXzPRty8zbhHMxAvQXEsKtrULACBexxTWVVdP8q7g/exec";

  let printerCharacteristic = null;

  // Formats items precisely matching a 32-character structural limit grid
  function padLine58mm(leftText, rightText) {
    const lineLimit = 32;
    const paddingSpace = lineLimit - (leftText.length + rightText.length);
    return paddingSpace > 0 ? leftText + " ".repeat(paddingSpace) + rightText : leftText + " " + rightText;
  }

  // Native Web Bluetooth Connection Pipeline
  document.getElementById('connectBtn').addEventListener('click', async () => {
    try {
      const printerUUID = '000018f0-0000-1000-8000-00805f9b34fb';
      
      const device = await navigator.bluetooth.requestDevice({
        filters: [{ services: [printerUUID] }, { namePrefix: 'XP' }, { namePrefix: 'MTP' }, { namePrefix: 'PT' }],
        optionalServices: [printerUUID]
      });

      const server = await device.gatt.connect();
      const service = await server.getPrimaryService(printerUUID);
      const characteristics = await service.getCharacteristics();
      
      printerCharacteristic = characteristics.find(c => c.properties.write || c.properties.writeWithoutResponse);

      if(printerCharacteristic) {
        const el = document.getElementById('printerStatus');
        el.innerText = "✅ Printer Ready";
        el.className = "badge status-connected";
        document.getElementById('checkoutBtn').disabled = false;
        document.getElementById('connectBtn').style.display = 'none';
      }
    } catch(e) {
      alert("Hardware binding rejected: " + e.message);
    }
  });

  // POS Checkout Trigger Handler
  document.getElementById('checkoutBtn').addEventListener('click', async () => {
    const mockCart = [
      { name: "Hot Espresso", qty: 1, price: 3.00 },
      { name: "Sugar Croissant", qty: 2, price: 4.50 }
    ];
    const mockTotal = 12.00;

    document.getElementById('checkoutBtn').disabled = true;
    document.getElementById('checkoutBtn').innerText = "Syncing with Cloud Database...";

    try {
      // 1. Post transaction packet payload directly over secure network boundaries to Google Sheet
      const networkResponse = await fetch(GOOGLE_SCRIPT_API_URL, {
        method: "POST",
        mode: "cors", // Forces browser security checks to clear requests safely
        headers: { "Content-Type": "text/plain;charset=utf-8" }, 
        body: JSON.stringify({ cart: mockCart, total: mockTotal })
      });

      const dbResult = await networkResponse.json();

      if(dbResult.status === "Success") {
        document.getElementById('checkoutBtn').innerText = "Printing Hardcopy...";
        await outputToThermalHead(dbResult.orderId, mockCart, mockTotal);
        alert("Transaction complete. Spreadsheet logged & receipt printed!");
      } else {
        throw new Error(dbResult.message);
      }
    } catch(err) {
      alert("System Processing Error: " + err.message);
      console.error(err);
    } finally {
      document.getElementById('checkoutBtn').disabled = false;
      document.getElementById('checkoutBtn').innerText = "💳 Submit & Print Receipt";
    }
  });

  // Raw ESC/POS Binary Streaming Motor Function
  async function outputToThermalHead(invoiceId, cartArray, totalValue) {
    const ESC = '\x1B';
    const INIT = ESC + '\x40';
    const CENTER = ESC + '\x61\x01';
    const LEFT = ESC + '\x61\x00';
    const LF = '\x0A';

    let printTemplate = INIT + CENTER;
    printTemplate += "MOBILE CLOUD REGISTER" + LF;
    printTemplate += "Invoice No: " + invoiceId + LF;
    printTemplate += "--------------------------------" + LF;
    printTemplate += LEFT;

    cartArray.forEach(row => {
      let desc = `${row.qty}x ${row.name}`;
      let extPrice = `$${(row.qty * row.price).toFixed(2)}`;
      printTemplate += padLine58mm(desc, extPrice) + LF;
    });

    printTemplate += "--------------------------------" + LF;
    printTemplate += padLine58mm("BALANCE DUE", `$${totalValue.toFixed(2)}`) + LF;
    printTemplate += "--------------------------------" + LF;
    printTemplate += CENTER + "Safe Travels!" + LF;
    printTemplate += LF + LF + LF; // Paper extraction clearance buffers

    const uint8Payload = new TextEncoder().encode(printTemplate);
    const writeBatchSize = 20;

    // Send payload safely down the Bluetooth pipe
    for (let offset = 0; offset < uint8Payload.length; offset += writeBatchSize) {
      const streamSlice = uint8Payload.slice(offset, offset + writeBatchSize);
      await printerCharacteristic.writeValue(streamSlice);
      await new Promise(r => setTimeout(r, 20)); // Prevents buffer saturation failures
    }
  }
</script>
</body>
</html>
